[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-processing-prep"
version = "0.1.0"
description = "Reusable signal-processing analysis toolkit for exploratory time-series condition monitoring tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pywavelets",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "soundfile",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
notebook = [
    "ipykernel",
    "ipympl",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
